<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORTOURNAL</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORTOURNAL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#000000;--sf:#0C0A0B;--rs:#151012;--tx:#FAF1F3;--mu:#B8A5AB;--gold:#CDB650;--ch:#EADFA8;--rose:#E0356F;--pink:#F4A9BA;--pos:#D8C466;--neg:#FF5C8A;--bd:rgba(244,169,186,.30);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#FFF6F8;--sf:#FFFFFF;--rs:#FFEDF1;--tx:#2B1219;--mu:#7D6169;--gold:#8F7A1C;--ch:#6F5F14;--rose:#C2185B;--pink:#D9486F;--pos:#7A6E12;--neg:#C2185B;--bd:rgba(194,24,91,.32);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:620px;margin:0 auto;padding:0 16px 110px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.brand{font-size:26px;letter-spacing:.14em;background:linear-gradient(90deg,var(--pink),var(--ch));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;color:var(--mu);font-style:italic}
.ctl{display:flex;gap:8px}
.pill{background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.pill.on{border-color:var(--gold);color:var(--ch)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(180deg,var(--rs),var(--sf));border-color:var(--gold)}
.lbl{color:var(--mu);font-size:13px}
.big{font-size:40px;color:var(--ch);font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 10px}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{background:var(--sf);border:1px solid var(--gold);color:var(--ch);border-radius:12px;padding:12px 8px;font:inherit;font-weight:500;cursor:pointer;text-align:center}
.btn.fill{background:linear-gradient(135deg,var(--rose),var(--pink));color:#1B0A10;border-color:var(--pink);font-weight:600}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn:active{transform:scale(.98)}
h2{font-size:21px;margin:18px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:0}
.card.row{padding:13px 14px;border-bottom:1px solid var(--bd)}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:500}.mid small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{color:var(--pos)}.n{color:var(--neg)}.t{color:var(--pink)}
.bar{height:6px;border-radius:3px;background:var(--rs);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}
.back{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);border:1px solid var(--gold);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;margin:10px 0 0;color:var(--mu);font-size:13px}
input,select,textarea{width:100%;margin-top:4px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
.err{color:var(--neg);min-height:18px;margin:8px 0 0;font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.empty{color:var(--mu);text-align:center;padding:22px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dim{opacity:.55}
.kp{display:grid;grid-template-columns:repeat(3,68px);gap:16px 26px;justify-content:center;margin:14px 0 22px}
.kb{width:auto;padding:0}.kb i{width:68px;height:68px;font-size:26px;color:var(--ch);box-shadow:0 0 0 4px rgba(244,169,186,.1)}
.pdots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px;min-height:16px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pink)}.pdots i.f{background:var(--pink)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;text-transform:uppercase}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
.cd.td{border-color:var(--rose);color:var(--pink);font-weight:600}
.cd.sl{background:linear-gradient(135deg,var(--rose),var(--pink));color:#1B0A10;border-color:var(--pink)}
.cd.ot{opacity:.38}
.dots{display:flex;gap:3px;height:8px;margin-top:4px}
.dots i,.dot2{display:inline-block;width:7px;height:7px;border-radius:50%;box-sizing:border-box;flex:none}
.cd.sl .dots i{outline:1px solid #1B0A10}
.k-inc{background:var(--gold)}.k-exp{background:var(--rose)}.k-tr{background:var(--mu)}
.k-pay{border:2px solid var(--rose)}.k-rinc{border:2px solid var(--gold)}.k-owed{border:2px solid var(--pink)}.k-note{background:var(--pink)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu);margin:10px 0}.leg span{display:flex;align-items:center;gap:6px}
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;pointer-events:none}
.core{pointer-events:auto;width:66px;height:66px;border-radius:50%;color:var(--pink);border:2px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--rose),var(--pink)) border-box;box-shadow:0 0 0 7px rgba(244,169,186,.14),0 6px 22px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer;padding:0}
.core:active{transform:scale(.95)}
.pm{position:fixed;inset:0;z-index:50;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 200px;background:var(--bg)}
.pm .opt{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:22px;color:var(--pink);font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.pg{display:grid;grid-template-columns:1fr 1fr;justify-items:center;max-width:420px;margin:0 auto}
.pg .pb:nth-child(3n){grid-column:1/3;margin-top:-6px}
.narrow{max-width:460px;margin:0 auto}
.pb{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;color:var(--pink);font:inherit;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;width:130px;padding:6px 0}
.pb i{font-style:normal;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--pink);border:2px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--rose),var(--pink)) border-box;box-shadow:0 0 0 6px rgba(244,169,186,.12),0 0 22px rgba(244,169,186,.14)}
.pb.on{color:var(--gold)}
.pb i.on{background:linear-gradient(135deg,var(--rose),var(--pink)) border-box;color:#1B0A10}
.pb:active i{transform:scale(.94)}
.pb.sm{width:auto;padding:0}.pb.sm i{width:50px;height:50px;font-size:22px;box-shadow:0 0 0 4px rgba(244,169,186,.12)}
.blur{filter:blur(7px)}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.ck{display:flex;align-items:center;gap:10px;color:var(--tx);margin:8px 0;font-size:15px}.ck input{width:20px;height:20px;margin:0;accent-color:var(--gold)}
.hide{display:none}
@media print{.dock,.pm,.top .ctl,.pill,.btn,.tag{display:none!important}body,.card{background:#fff!important;color:#000!important}.card{border-color:#999}.num,.big,.brand{color:#000!important}}
.pill{white-space:nowrap}
@media(max-width:480px){.brand{font-size:20px;letter-spacing:.09em}.top .pill{padding:6px 10px}.three .btn{font-size:13px;padding:12px 4px}}
@media(min-width:900px){
body{font-size:16px}
#app{max-width:1080px;padding:0 28px 130px}
main.cols{columns:2;column-gap:26px}
main.cols>*{break-inside:avoid}
main.cols>h2{break-after:avoid}
main:not(.cols){max-width:780px;margin:0 auto}
.back{align-items:center}
.sheet{border-radius:18px;max-width:560px}
.cd{min-height:66px}
.pm{padding-top:36px}
.pg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 36px;max-width:780px;padding-bottom:50px}
.pg .pb:nth-child(3n){grid-column:auto;margin-top:0}
.pg .pb:nth-child(even){transform:translateY(34px)}
}
</style>
</head>

const INC=['salary','Mami Monthly','Elchizetla Weekly','other'];
const EXP=['food','transportation','groceries','laundry','monthly_bills','family','amorcito','pokemon_go','personal_outings','others'];

const SK='fortournal.v2';
function loadStore(){try{const s=JSON.parse(localStorage.getItem(SK));if(s&&s.users)return s}catch(e){}return{users:[],cur:null,data:{},groups:[],lang:'en'}}
let ST=loadStore();
const hp=s=>{let h=5381;for(const c of String(s)+'|ft')h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
function load(){if(ST.cur&&ST.data[ST.cur])return ST.data[ST.cur];
 return{lang:ST.lang||((navigator.language||'en').toLowerCase().startsWith('es')?'es':'en'),theme:'dark',privacy:false,accounts:[],txns:[],trs:[],owed:[],rinc:[],pays:[],goals:[],notes:[]}}
let S=load(),UI={tab:'home',q:'',f:'all',acc:'',modal:null,pend:null};
const save=()=>{if(ST.cur)ST.data[ST.cur]=S;try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}};
const norm=()=>{['owed','rinc','pays','goals','notes'].forEach(k=>S[k]=S[k]||[]);S.cats=S.cats||{income:[...INC],expense:[...EXP]};S.bud=S.bud||{};S.lock=S.lock||{on:false,mins:0}};norm();
const t=k=>T[S.lang][k]||k;
const catName=k=>T[S.lang][k]||k;
const loc=()=>S.lang==='es'?'es-MX':'en-US';
const fd=d=>new Date(d+'T00:00').toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'});
const money=c=>S.privacy?'••••••':new Intl.NumberFormat(loc(),{style:'currency',currency:'MXN'}).format(c/100);
const accOf=id=>S.accounts.find(a=>a.id===id);
const accName=id=>accOf(id)?.name||'—';

// money is integer cents; never floats
function parseAmt(s,zero){s=String(s||'').trim().replace(/,/g,'');if(!/^\d+(\.\d{1,2})?$/.test(s))return null;const[i,d='']=s.split('.');const c=parseInt(i,10)*100+parseInt((d+'00').slice(0,2),10);return(c>0||zero)?c:null}
const fmtIn=c=>(c/100).toFixed(2);
function bal(id){let c=accOf(id).init;for(const x of S.txns)if(x.acc===id)c+=x.type==='income'?x.amt:-x.amt;for(const x of S.trs){if(x.to===id)c+=x.amt;if(x.from===id)c-=x.amt}return c}
function totals(){const act=S.accounts.filter(a=>a.active);const tot=act.reduce((s,a)=>s+bal(a.id),0);const av=act.filter(a=>a.type==='regular').reduce((s,a)=>s+bal(a.id),0);return{tot,av,sv:tot-av}}

function items(){const a=[...S.txns.map(x=>({k:'t',d:x.date,ts:x.ts,x})),...S.trs.map(x=>({k:'r',d:x.date,ts:x.ts,x}))];return a.sort((p,q)=>q.d.localeCompare(p.d)||q.ts-p.ts)}
function title(it){const x=it.x;if(it.k==='r')return t('tr');if(x.desc)return x.desc;return((x.cat==='other'||x.cat==='others')&&x.ctext)?x.ctext:catName(x.cat)}
function row(it){const x=it.x;
 if(it.k==='r')return`<div class="row" data-a="edit:r:${x.id}"><div class="ic t">⇄</div><div class="mid"><b>${t('tr')}</b><small>${esc(accName(x.from))} → ${esc(accName(x.to))} · ${fd(x.date)}${x.notes?' · '+esc(x.notes):''}</small></div><div class="num t">${money(x.amt)}</div></div>`;
 const inc=x.type==='income';
 return`<div class="row" data-a="edit:t:${x.id}"><div class="ic ${inc?'p':'n'}">${inc?'↑':'↓'}</div><div class="mid"><b>${esc(title(it))}</b><small>${esc(accName(x.acc))} · ${fd(x.date)}${x.notes?' · '+esc(x.notes):''}</small></div><div class="num ${inc?'p':'n'}">${inc?'+':'−'}${money(x.amt)}</div></div>`}

function header(){return`<div class="top"><div><h1 class="brand">FORTOURNAL</h1></div><div class="ctl"><button class="pill" data-a="tab:settings">${esc((S.name||'?').slice(0,1).toUpperCase())}</button><button class="pill ${S.privacy?'on':''}" data-a="privacy" aria-label="${t('priv')}">${S.privacy?'◎':'◉'}</button><button class="pill" data-a="lang"><b class="${S.lang==='en'?'p':''}">EN</b> / <b class="${S.lang==='es'?'p':''}">ES</b></button></div></div>`}
const ICO_CORE='<svg viewBox="0 0 40 40" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="20" cy="20" r="15"/><path d="M5 20h9.5M25.5 20H35"/><circle cx="20" cy="20" r="5.5"/></svg>',ICO_X='<svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 12l16 16M28 12L12 28"/></svg>';
function nav(){if(UI.modal)return'';return`<div class="dock"><button class="core" data-a="menu" aria-label="${t('menu')}">${UI.menu?ICO_X:ICO_CORE}</button></div>`}

function home(){const m=today().slice(0,7);let inc=0,exp=0;const by={};
 for(const x of S.txns)if(x.date.startsWith(m)){if(x.type==='income')inc+=x.amt;else{exp+=x.amt;by[x.cat]=(by[x.cat]||0)+x.amt}}
 const{tot,av,sv}=totals();const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=rows[0]?rows[0][1]:1;
 return`${S.accounts.length?'':`<div class="card"><b>${t('welcome')}</b><p class="lbl">${t('welcomeP')}</p><button class="btn fill" style="width:100%" data-a="newAcc">+ ${t('newAcc')}</button></div>`}<div class="card hero"><div class="lbl">${t('total')}</div><div class="big">${money(tot)}</div><div class="two"><div><div class="lbl">${t('avail')}</div><div class="num" style="font-size:20px">${money(av)}</div></div><div><div class="lbl">${t('sav')}</div><div class="num" style="font-size:20px">${money(sv)}</div></div></div></div>
 <div class="three"><button class="btn" data-a="new:income">↑ ${t('inc')}</button><button class="btn" data-a="new:expense">↓ ${t('exp')}</button><button class="btn" data-a="new:tr">⇄ ${t('tr')}</button></div>
 <h2>${t('rem')}</h2>${reminderCard()}<h2>${t('month')}</h2><div class="card"><div class="three"><div><div class="lbl">${t('inc')}</div><div class="num p">${money(inc)}</div></div><div><div class="lbl">${t('exp')}</div><div class="num n">${money(exp)}</div></div><div><div class="lbl">${t('net')}</div><div class="num">${money(inc-exp)}</div></div></div></div>
 ${rows.length?`<h2>${t('bycat')}</h2><div class="card">${rows.map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(catName(k))}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${Math.max(4,Math.round(v/mx*100))}%"></i></div></div>`).join('')}</div>`:''}
 <h2>${t('recent')}</h2><div class="card">${items().slice(0,5).map(row).join('')||`<div class="empty">${t('empty')}</div>`}</div>`}

function match(it,q){q=q.toLowerCase();const x=it.x;const hay=[title(it),x.notes,x.ctext,it.k==='r'?accName(x.from)+' '+accName(x.to):accName(x.acc),fmtIn(x.amt),x.date,fd(x.date),it.k==='r'?'transfer':x.type].join(' ').toLowerCase();return hay.includes(q)}
function listHtml(){let a=items();
 if(UI.f==='income')a=a.filter(i=>i.k==='t'&&i.x.type==='income');else if(UI.f==='expense')a=a.filter(i=>i.k==='t'&&i.x.type==='expense');else if(UI.f==='transfer')a=a.filter(i=>i.k==='r');
 if(UI.acc)a=a.filter(i=>i.k==='r'?(i.x.from===UI.acc||i.x.to===UI.acc):i.x.acc===UI.acc);
 if(UI.q.trim())a=a.filter(i=>match(i,UI.q.trim()));
 return a.map(row).join('')||`<div class="empty">${t('empty')}</div>`}
function moves(){return`<h2>${t('moves')}</h2><input id="q" placeholder="${esc(t('search'))}" value="${esc(UI.q)}"><div class="chips">${['all','income','expense','transfer'].map(f=>`<button class="pill ${UI.f===f?'on':''}" data-a="filt:${f}">${t(f)}</button>`).join('')}${UI.acc?`<button class="pill on" data-a="clearAcc">${esc(accName(UI.acc))} ✕</button>`:''}</div><div class="card" id="list">${listHtml()}</div>`}

function accounts(){const act=S.accounts.filter(a=>a.active),off=S.accounts.filter(a=>!a.active);
 const card=a=>`<div class="card ${a.active?'':'dim'}" style="display:flex;align-items:center;gap:10px"><div class="mid" data-a="accTx:${a.id}" style="cursor:pointer"><b>${esc(a.name)}</b><small>${a.type==='savings'?t('savT'):t('reg')}</small></div><div class="num" style="font-size:18px">${money(bal(a.id))}</div><button class="pill" data-a="editAcc:${a.id}" aria-label="${t('edit')}">✎</button></div>`;
 return`<h2>${t('accounts')}</h2>${act.map(card).join('')}<button class="btn fill" style="width:100%;margin-top:6px" data-a="newAcc">+ ${t('newAcc')}</button>${off.length?`<h2>${t('inactive')}</h2>${off.map(card).join('')}`:''}`}

function settings(){return`<h2>${t('settings')}</h2><div class="card"><div class="lbl">${t('session')}</div><b>${esc(S.name||'')}</b><button class="btn" style="width:100%;margin-top:10px" data-a="logout">${t('logout')}</button></div><div class="card"><div class="lbl">${t('lang')}</div><div class="chips"><button class="pill ${S.lang==='en'?'on':''}" data-a="setlang:en">English</button><button class="pill ${S.lang==='es'?'on':''}" data-a="setlang:es">Español</button></div>
 <div class="lbl" style="margin-top:12px">${t('theme')}</div><div class="chips"><button class="pill ${S.theme==='dark'?'on':''}" data-a="theme:dark">${t('dark')}</button><button class="pill ${S.theme==='light'?'on':''}" data-a="theme:light">${t('light')}</button></div>
 <div class="lbl" style="margin-top:12px">${t('priv')}</div><div class="chips"><button class="pill ${S.privacy?'on':''}" data-a="privacy">${S.privacy?'ON':'OFF'}</button></div></div>
 ${['income','expense'].map(ty=>`<div class="card"><div class="lbl">${t('cats')} · ${ty==='income'?t('inc'):t('exp')}</div>${S.cats[ty].map((c,i)=>`<div class="row" data-a="edit:c:${ty}.${i}"><div class="mid">${esc(catName(c))}</div><span>✎</span></div>`).join('')}<button class="btn" style="width:100%;margin-top:8px" data-a="nm:c:${ty}">+ ${t('newCat')}</button></div>`).join('')}${(()=>{const u=curUser()||{};return`<div class="card"><div class="lbl">${t('secTitle')}</div><p style="margin:6px 0 0">${esc(u.email||t('noMail'))}</p><div class="chips"><button class="pill" data-a="nm:pc">${t('chPin')}</button><button class="pill" data-a="nm:sr">${t('recov')}</button></div><div class="lbl" style="margin-top:6px">${t('tfaTitle')}: <b style="color:var(--ch)">${u.totp?t('onn'):t('off')}</b></div><button class="btn" style="width:100%;margin-top:8px" data-a="${u.totp?'nm:tfoff':'tf0'}">${u.totp?t('tfaOff'):t('tfaOn')}</button><p class="lbl" style="margin:10px 0 0">${t('tfaNote')}</p></div>`})()}
 <div class="card"><div class="lbl">${t('bkTitle')}</div><p class="lbl" style="margin:4px 0 10px">${t('bkNote')}</p><div class="lbl">${t('bkLast')}: <b style="color:var(--ch)">${S.lastBackup?fd(S.lastBackup):t('bkNever')}</b></div><button class="btn fill" style="width:100%;margin-top:10px" data-a="bk">${t('bkNow')}</button><label class="btn" style="display:block;text-align:center;margin-top:10px;color:var(--ch)">${t('bkRestore')}<input id="rbf" type="file" accept=".json,application/json" style="display:none"></label>${UI.toast?`<p class="${UI.toast[0]==='✓'?'p':'err'}" style="margin:10px 0 0">${esc(UI.toast)}</p>`:''}</div>
 <div class="card"><div class="lbl">${t('lkTitle')}</div><div class="chips"><button class="pill ${S.lock.on?'on':''}" data-a="lock:${S.lock.on?'off':'on'}">${S.lock.on?t('lkOn')+' ✓':t('off')}</button></div>${S.lock.on?`<div class="chips">${[0,1,5].map(m=>`<button class="pill ${S.lock.mins===m?'on':''}" data-a="lockm:${m}">${t('lk'+m)}</button>`).join('')}</div><button class="btn" style="width:100%" data-a="lockn">${t('lkNow')}</button>`:''}<p class="lbl" style="margin:10px 0 0">${t('lkNote')}</p></div>
 <div class="card"><p class="lbl" style="margin:0 0 12px">${t('local')}</p><button class="btn danger" style="width:100%" data-a="reset">${t('reset')}</button></div>`}

// ----- modals -----
const opts=(arr,sel,fn)=>arr.map(v=>`<option value="${esc(v.id??v)}" ${(v.id??v)===sel?'selected':''}>${esc(fn(v))}</option>`).join('');
function delBtn(key){return UI.modal.id?`<button type="button" class="btn danger" data-a="del:${key}">${UI.pend===key?t('sure'):t('del')}</button>`:'<span></span>'}
function txModal(m){const x=m.id?S.txns.find(v=>v.id===m.id):{};const type=x.type||m.type;const cats=[...S.cats[type]];if(x.cat&&!cats.includes(x.cat))cats.push(x.cat);const accs=S.accounts.filter(a=>a.active||a.id===x.acc);const other=x.cat||cats[0];
 return`<h2>${m.id?t('edit'):t(type==='income'?'addInc':'addExp')}</h2><form id="f" data-kind="t" data-type="${type}">
 <label>${t('acct')}<select name="acc">${opts(accs,x.acc,a=>a.name)}</select></label>
 <label>${t('cat')}<select name="cat" id="cat">${opts(cats,x.cat,catName)}</select></label>
 <label id="ct" class="${other==='other'||other==='others'?'':'hide'}">${t('custom')}<input name="ctext" value="${esc(x.ctext)}"></label>
 <label>${t('amt')}<input name="amt" inputmode="decimal" placeholder="0.00" value="${x.amt?fmtIn(x.amt):''}"></label>
 <label>${t('date')}<input type="date" name="date" value="${x.date||today()}"></label>
 <label>${t('notes')}<textarea name="notes" rows="2">${esc(x.notes)}</textarea></label>
 <p class="err" id="err"></p><div class="acts"><button type="button" class="btn" data-a="close">${t('cancel')}</button><button class="btn fill">${t('save')}</button></div></form><div class="acts">${delBtn('t:'+m.id)}</div>`}
function trModal(m){const x=m.id?S.trs.find(v=>v.id===m.id):{};const accs=S.accounts.filter(a=>a.active||a.id===x.from||a.id===x.to);
 return`<h2>${m.id?t('edit'):t('addTr')}</h2><form id="f" data-kind="r">
 <label>${t('from')}<select name="from">${opts(accs,x.from,a=>a.name)}</select></label>
 <label>${t('to')}<select name="to">${opts(accs,x.to||(accs[1]&&accs[1].id),a=>a.name)}</select></label>
 <label>${t('amt')}<input name="amt" inputmode="decimal" placeholder="0.00" value="${x.amt?fmtIn(x.amt):''}"></label>
 <label>${t('date')}<input type="date" name="date" value="${x.date||today()}"></label>
 <label>${t('notes')}<textarea name="notes" rows="2">${esc(x.notes)}</textarea></label>
 <p class="err" id="err"></p><div class="acts"><button type="button" class="btn" data-a="close">${t('cancel')}</button><button class="btn fill">${t('save')}</button></div></form><div class="acts">${delBtn('r:'+m.id)}</div>`}
function accModal(m){const a=m.id?accOf(m.id):{type:'regular',init:0,active:true};
 return`<h2>${m.id?t('edit'):t('newAcc')}</h2><form id="f" data-kind="a">
 <label>${t('name')}<input name="name" value="${esc(a.name)}"></label>
 <label>${t('type')}<select name="type"><option value="regular" ${a.type==='regular'?'selected':''}>${t('reg')}</option><option value="savings" ${a.type==='savings'?'selected':''}>${t('savT')}</option></select></label>
 <label>${t('init')}<input name="init" inputmode="decimal" value="${fmtIn(a.init)}"></label>
 <p class="err" id="err"></p><div class="acts"><button type="button" class="btn" data-a="close">${t('cancel')}</button><button class="btn fill">${t('save')}</button></div></form>
 ${m.id?`<div class="acts"><button type="button" class="btn" data-a="toggleAcc:${m.id}">${a.active?t('deact'):t('react')}</button></div>`:''}`}
function modal(){const m=UI.modal;return`<div class="back" id="back"><div class="sheet">${modalBody(m)}</div></div>`}

function render(){const r=document.documentElement;r.dataset.theme=S.theme;r.lang=S.lang;
 if(!ST.cur){document.getElementById('app').innerHTML='<div class="narrow">'+loginView()+'</div>';return}
 if(UI.locked){document.getElementById('app').innerHTML='<div class="narrow">'+lockView()+'</div>';return}
 document.getElementById('app').innerHTML=header()+`<main class="${(UI.tab==='home'||UI.tab==='settings'||(UI.tab==='more'&&UI.sec==='report'))?'cols':''}">${{home,moves,accounts,more,settings}[UI.tab]()}</main>`+(UI.menu?menuView():'')+nav()+(UI.modal?modal():'')}

// ----- sections: owed, recurring income, payments, goals, report -----
const FQ={weekly:'weekly',every_2_weeks:'every2w',every_3_weeks:'every3w',monthly:'monthly',once:'once',every_3_months:'every3m',yearly:'yearly'};
function nxt(iso,f,day){const[y,m,d]=iso.split('-').map(Number);const wk={weekly:7,every_2_weeks:14,every_3_weeks:21}[f];if(wk)return new Date(Date.UTC(y,m-1,d+wk)).toISOString().slice(0,10);const k=f==='monthly'?1:f==='every_3_months'?3:12;const last=new Date(Date.UTC(y,m-1+k+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+k,Math.min(day||d,last))).toISOString().slice(0,10)}
const dd=iso=>Math.round((new Date(iso+'T00:00')-new Date(today()+'T00:00'))/864e5);
const sh=(m,n)=>{const[y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-1+n,1)).toISOString().slice(0,7)};
const smx=(L,ty)=>L.filter(x=>x.type===ty).reduce((s,x)=>s+x.amt,0);
const bk=()=>`<button class="pill" data-a="menu" style="margin-top:8px">‹ ${t('menu')}</button>`;
const emp=()=>`<div class="empty">${t('empty')}</div>`;
const addBtn=(k,l)=>`<button class="btn fill" style="width:100%;margin-top:6px" data-a="nm:${k}">+ ${t(l)}</button>`;
function oStat(o){const rep=o.reps.filter(r=>S.txns.some(x=>x.id===r.tx)).reduce((s,r)=>s+r.amt,0),rem=o.amt-rep;return{rep,rem,st:rem<=0?'paid':(o.exp&&o.exp<today())?'overdue':rep>0?'partial':'pending'}}
function more(){if(UI.sec)return{owed:secOwed,rinc:secRinc,pays:secPays,goals:secGoals,nts:secNotes,bud:secBud,grps:secGroups,cal:secCal,report:secReport}[UI.sec]();
 return`<h2>${t('more')}</h2>${[['owed','◇'],['rinc','↻'],['pays','▣'],['goals','☆'],['nts','▢'],['bud','◑'],['grps','⊕'],['report','▤']].map(([k,i])=>`<div class="card row" data-a="sec:${k}"><div class="ic">${i}</div><div class="mid"><b>${t(k)}</b></div><span>›</span></div>`).join('')}`}
function secOwed(){const L=S.owed.map(o=>({o,...oStat(o)}));const out=L.reduce((s,v)=>s+Math.max(0,v.rem),0),rp=L.reduce((s,v)=>s+v.rep,0);
 return`${bk()}<h2>${t('owed')}</h2><div class="card"><div class="two"><div><div class="lbl">${t('outst')}</div><div class="num" style="font-size:20px">${money(out)}</div></div><div><div class="lbl">${t('repaid')}</div><div class="num p" style="font-size:20px">${money(rp)}</div></div></div></div>${L.map(v=>`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="mid"><b>${esc(v.o.who)}</b><small>${esc(v.o.desc||'')}${v.o.exp?' · '+fd(v.o.exp):''}</small></div><div style="text-align:right"><div class="num">${money(v.rem)}</div><small class="${v.st==='paid'?'p':v.st==='overdue'?'n':'lbl'}">${t(v.st)}</small></div><button class="pill" data-a="edit:o:${v.o.id}">✎</button></div>${v.rem>0?`<button class="btn" style="width:100%;margin-top:10px" data-a="settle:owed:${v.o.id}">${t('receive')}</button>`:''}</div>`).join('')||emp()}${addBtn('o','owed')}`}
function secRinc(){return`${bk()}<h2>${t('rinc')}</h2><p class="lbl">${t('expNote')}</p>${S.rinc.map(r=>`<div class="card ${r.active?'':'dim'}"><div style="display:flex;gap:10px;align-items:center"><div class="mid"><b>${esc(r.name)}</b><small>${t(FQ[r.freq])} · ${esc(accName(r.acc))}${r.active?' · '+fd(r.next):''}</small></div><div class="num p">${money(r.amt)}</div><button class="pill" data-a="edit:ri:${r.id}">✎</button></div>${r.active?`<button class="btn" style="width:100%;margin-top:10px" data-a="settle:rcv:${r.id}">${t('markRcv')}</button>`:''}</div>`).join('')||emp()}${addBtn('ri','rinc')}`}
function secPays(){return`${bk()}<h2>${t('pays')}</h2>${S.pays.map(p=>{const d=dd(p.next),st=d<0?'overdue':d<=3?'dueSoon':'upcoming';return`<div class="card ${p.active?'':'dim'}"><div style="display:flex;gap:10px;align-items:center"><div class="mid"><b>${esc(p.name)}</b><small>${t(FQ[p.freq])} · ${esc(accName(p.acc))} · ${fd(p.next)}${p.hist?' · ✓'+p.hist:''}</small><small>${t('payWith')}: ${esc(fundName(p))}</small></div><div style="text-align:right"><div class="num n">${money(p.amt)}</div><small class="${st==='overdue'?'n':st==='dueSoon'?'t':'lbl'}">${t(st)}</small></div><button class="pill" data-a="edit:py:${p.id}">✎</button></div>${p.active?`<button class="btn" style="width:100%;margin-top:10px" data-a="settle:pay:${p.id}">${t('markPaid')}</button>`:''}</div>`}).join('')||emp()}${addBtn('py','pays')}`}
function secGoals(){return`${bk()}<h2>${t('goals')}</h2>${S.goals.map(g=>{const sv=g.cs.reduce((s,c)=>s+c.amt,0),pc=Math.min(100,Math.floor(sv*100/g.amt));return`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="mid"><b>${esc(g.name)}</b><small>${g.date?fd(g.date)+' ':''}${esc(g.desc||'')}</small></div><button class="pill" data-a="edit:g:${g.id}">✎</button></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="num">${money(sv)} / ${money(g.amt)}</span><span class="num">${pc}%</span></div><div class="bar"><i style="width:${pc}%"></i></div><button class="btn" style="width:100%;margin-top:10px" data-a="gcon:${g.id}">${t('contrib')}</button></div>`}).join('')||emp()}${addBtn('g','goals')}`}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const addD=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const rng=(rp,d)=>{if(rp==='day')return[d,d];if(rp==='week'){const a=addD(d,-((new Date(d+'T00:00').getDay()+6)%7));return[a,addD(a,6)]}const m=d.slice(0,7);return[m+'-01',addD(sh(m,1)+'-01',-1)]};
const shiftP=(rp,d,n)=>rp==='day'?addD(d,n):rp==='week'?addD(d,7*n):sh(d.slice(0,7),n)+'-01';
function rep(){const rp=UI.rp||'month',d=UI.rd||today(),[a,b]=rng(rp,d),[pa,pb]=rng(rp,shiftP(rp,d,-1));const L=S.txns.filter(x=>x.date>=a&&x.date<=b),P=S.txns.filter(x=>x.date>=pa&&x.date<=pb);
 return{rp,a,b,L,inc:smx(L,'income'),exp:smx(L,'expense'),pexp:smx(P,'expense')}}
const rlabel=r=>cap(r.rp==='week'?fd(r.a)+' \u2013 '+fd(r.b):new Date(r.a+'T00:00').toLocaleDateString(loc(),r.rp==='day'?{day:'numeric',month:'long',year:'numeric'}:{month:'long',year:'numeric'}));
const grpRows=(L,ty)=>{const o={};L.filter(x=>x.type===ty).forEach(x=>o[x.cat]=(o[x.cat]||0)+x.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function buckets(r){const B=[];if(r.rp==='day')B.push({l:'',d:r.a});else for(let x=r.a;x<=r.b;x=addD(x,1))B.push({l:r.rp==='week'?new Date(x+'T00:00').toLocaleDateString(loc(),{weekday:'short'}).slice(0,3):String(+x.slice(8)),d:x});
 return B.map(b=>{const L=r.L.filter(x=>x.date===b.d);return{l:b.l,i:smx(L,'income'),e:smx(L,'expense')}})}
function barChart(B){const mx=Math.max(1,...B.map(b=>Math.max(b.i,b.e))),w=320,h=110,n=B.length,g=w/n,bw=Math.max(2,Math.min(14,g*.36));
 return`<svg viewBox="0 0 ${w} ${h+18}" width="100%" role="img" aria-label="${t('chInc')}">${B.map((b,k)=>{const x=k*g+g/2,hi=b.i/mx*h,he=b.e/mx*h;return`<rect x="${x-bw-1}" y="${h-hi}" width="${bw}" height="${hi}" rx="1.5" fill="var(--pos)"/><rect x="${x+1}" y="${h-he}" width="${bw}" height="${he}" rx="1.5" fill="var(--rose)"/>`+(n<=8||k%Math.ceil(n/8)===0?`<text x="${x}" y="${h+13}" text-anchor="middle" font-size="9" fill="var(--mu)">${b.l}</text>`:'')}).join('')}<line x1="0" x2="${w}" y1="${h}" y2="${h}" stroke="var(--bd)"/></svg><div style="display:flex;gap:16px;font-size:12px;color:var(--mu)"><span><i class="dot" style="background:var(--pos)"></i>${t('inc')}</span><span><i class="dot" style="background:var(--rose)"></i>${t('exp')}</span></div>`}
const PAL=['#E0356F','#F4A9BA','#CDB650','#FBD3DC','#EADFA8','#A85A78'];
function donut(rows,total){const r=42,c=2*Math.PI*r;let off=0;const top=rows.slice(0,5),rest=rows.slice(5).reduce((s,v)=>s+v[1],0),sl=rest?[...top,['others',rest]]:top;
 return`<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 100 100" width="130" height="130" role="img" aria-label="${t('chCat')}"><g transform="rotate(-90 50 50)">${sl.map(([k,v],i)=>{const len=v/total*c,el=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${PAL[i]}" stroke-width="14" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"/>`;off+=len;return el}).join('')}</g></svg><div style="flex:1;min-width:0">${sl.map(([k,v],i)=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><i class="dot" style="background:${PAL[i]};margin:0;flex:none"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(catName(k))}</span><span class="num">${Math.round(v*100/total)}%</span></div>`).join('')}</div></div>`}
function secReport(){const r=rep(),er=grpRows(r.L,'expense'),ir=grpRows(r.L,'income');
 const list=rows=>rows.map(([k,v])=>`<div class="row" style="cursor:default"><div class="mid">${esc(catName(k))}</div><div class="num">${money(v)}</div></div>`).join('')||emp();
 return`${bk()}<h2>${t('report')}</h2><div class="chips">${['day','week','month'].map(p=>`<button class="pill ${r.rp===p?'on':''}" data-a="rp:${p}">${t('p'+p)}</button>`).join('')}</div>
 <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0"><button class="pill" data-a="rn:-1">\u2039</button><b class="serif" style="font-size:20px;text-align:center">${rlabel(r)}</b><button class="pill" data-a="rn:1">\u203a</button></div>
 <div class="card"><div class="three"><div><div class="lbl">${t('inc')}</div><div class="num p">${money(r.inc)}</div></div><div><div class="lbl">${t('exp')}</div><div class="num n">${money(r.exp)}</div></div><div><div class="lbl">${t('net')}</div><div class="num">${money(r.inc-r.exp)}</div></div></div><p class="lbl" style="margin:10px 0 0">${t('vsPrev')}: ${money(r.exp)} / ${money(r.pexp)}</p></div>
 <h2>${t('chInc')}</h2><div class="card ${S.privacy?'blur':''}">${barChart(buckets(r))}</div>
 <h2>${t('chCat')}</h2><div class="card">${er.length?donut(er,r.exp):emp()}</div>
 <h2>${t('chSav')}</h2><div class="card">${savCard()}</div>
 <h2>${t('inc')}</h2><div class="card">${list(ir)}</div><h2>${t('exp')}</h2><div class="card">${list(er)}</div>
 <div class="two"><button class="btn fill" data-a="exp:xlsx">${t('exX')}</button><button class="btn fill" data-a="exp:docx">${t('exW')}</button></div><button class="btn" style="width:100%;margin-top:10px" data-a="print">${t('print')}</button>${UI.toast?`<p class="err">${esc(UI.toast)}</p>`:''}`}

// ----- export: xlsx / docx built by hand (zip, no libraries) -----
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CRC=(()=>{const a=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;a[n]=c>>>0}return a})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const[name,txt]of Object.entries(files)){const nb=enc.encode(name),d=enc.encode(txt),c=crc32(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  parts.push(h.buffer,nb,d);cd.push(e.buffer,nb);off+=30+nb.length+d.length}
 const cdLen=cd.reduce((s,b)=>s+b.byteLength,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,Object.keys(files).length,true);z.setUint16(10,Object.keys(files).length,true);z.setUint32(12,cdLen,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,z.buffer])}
const XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const colL=i=>String.fromCharCode(65+i);
const sheetXml=rows=>`${XH}<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r,y)=>`<row r="${y+1}">${r.map((v,x)=>typeof v==='number'?`<c r="${colL(x)}${y+1}"><v>${v}</v></c>`:`<c r="${colL(x)}${y+1}" t="inlineStr"><is><t>${xe(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;
function mkXlsx(m){const sh2=[{n:t('report'),rows:[[m.title],[],...m.sum,[],[t('exp')],[t('cat'),t('amt'),'%'],...m.ex,[],[t('inc')],[t('cat'),t('amt'),'%'],...m.ic]},{n:t('moves'),rows:[[t('date'),t('type'),t('cat'),t('acct'),t('amt'),t('notes')],...m.tx]}];
 const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',F={'[Content_Types].xml':`${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sh2.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`,
 '_rels/.rels':`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
 'xl/workbook.xml':`${XH}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>${sh2.map((s,i)=>`<sheet name="${xe(s.n.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`,
 'xl/_rels/workbook.xml.rels':`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sh2.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`};
 sh2.forEach((s,i)=>F[`xl/worksheets/sheet${i+1}.xml`]=sheetXml(s.rows));return zip(F)}
const mf=v=>new Intl.NumberFormat(loc(),{style:'currency',currency:'MXN'}).format(v);
const wp=(s,o={})=>`<w:p><w:pPr><w:spacing w:after="${o.after??120}"/></w:pPr><w:r><w:rPr>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${xe(s)}</w:t></w:r></w:p>`;
const wt=rows=>`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="C6A15B"/>`).join('')}</w:tblBorders></w:tblPr>${rows.map((r,i)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr>${i===0?'<w:shd w:val="clear" w:color="auto" w:fill="F4EFE5"/>':''}</w:tcPr>${wp(String(c),{b:i===0,sz:20,after:0})}</w:tc>`).join('')}</w:tr>`).join('')}</w:tbl>${wp('',{after:60})}`;
function mkDocx(m){const bar=p=>'\u2588'.repeat(Math.round(p/5)),cat=a=>[[t('cat'),t('amt'),'%',''],...a.map(([n,v,p])=>[n,mf(v),p+'%',bar(p)])];
 const body=wp(m.title,{b:1,sz:36,c:'8A6D2F'})+wt([[t('report'),''],...m.sum.map(([a,v])=>[a,mf(v)])])+wp(t('exp'),{b:1,sz:26})+(m.ex.length?wt(cat(m.ex)):wp(t('empty')))+wp(t('inc'),{b:1,sz:26})+(m.ic.length?wt(cat(m.ic)):wp(t('empty')))+wp(t('moves'),{b:1,sz:26})+(m.tx.length?wt([[t('date'),t('type'),t('cat'),t('acct'),t('amt')],...m.tx.map(x=>[x[0],x[1],x[2],x[3],mf(x[4])])]):wp(t('empty')));
 return zip({'[Content_Types].xml':`${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`,
 '_rels/.rels':`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
 'word/document.xml':`${XH}<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`})}
function repModel(r){const ex=grpRows(r.L,'expense'),ic=grpRows(r.L,'income'),pc=(v,tt)=>tt?Math.round(v*100/tt):0;
 return{title:'FORTOURNAL \u2014 '+rlabel(r),sum:[[t('inc'),r.inc/100],[t('exp'),r.exp/100],[t('net'),(r.inc-r.exp)/100]],
 ex:ex.map(([k,v])=>[catName(k),v/100,pc(v,r.exp)]),ic:ic.map(([k,v])=>[catName(k),v/100,pc(v,r.inc)]),
 tx:[...r.L].sort((p,q)=>p.date.localeCompare(q.date)||p.ts-q.ts).map(x=>[x.date,x.type==='income'?t('inc'):t('exp'),title({k:'t',x}),accName(x.acc),x.amt/100,x.notes||''])}}
async function exportRep(kind){UI.toast='';try{const dl=window.claude&&await claude.use('downloads');if(!dl){UI.toast=t('noDl');return render()}
 const r=rep(),m=repModel(r);await dl.save({filename:`FORTOURNAL-${r.rp}-${r.a}.${kind}`,data:kind==='xlsx'?mkXlsx(m):mkDocx(m)})}catch(e){if(!e||e.code!=='declined')UI.toast=t('noDl')}render()}

// ----- notes & reminders -----
const fundName=p=>p.fund==='other'?(p.fundText||t('other')):t(p.fund==='savings'?'fSav':'salary');
const unit=n=>n===1?t('day'):t('days');
const when=n=>n<0?`${t('overdue')} ${-n} ${unit(-n)}`:n===0?t('dToday'):`${t('dIn')} ${n} ${unit(n)}`;
function reminders(){const out=[];for(const p of S.pays){if(!p.active)continue;const n=dd(p.next),rs=p.rem||[7,3,1,0],mx=rs.length?Math.max(...rs):-1;if(n<0||n<=mx)out.push({n,txt:p.name,sub:`${money(p.amt)} · ${t('payWith')}: ${esc(fundName(p))}`,a:'sec:pays'})}

// ----- two-step verification (TOTP, RFC 6238) -----
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32enc=b=>{let bits='',o='';for(const x of b)bits+=x.toString(2).padStart(8,'0');for(let i=0;i<bits.length;i+=5)o+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return o};
const b32dec=s=>{let bits='';for(const c of s.replace(/=+$/,''))bits+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)};
async function totp(sec,ms){const c=Math.floor(ms/30000),buf=new ArrayBuffer(8),v=new DataView(buf);v.setUint32(0,Math.floor(c/4294967296));v.setUint32(4,c>>>0);
 const k=await crypto.subtle.importKey('raw',b32dec(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']),h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;
 return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,'0')}
async function chkTotp(sec,code){code=String(code||'').trim();if(!/^\d{6}$/.test(code))return false;for(const d of[0,-1,1])if(await totp(sec,Date.now()+d*30000)===code)return true;return false}

function shares(amt,ids){const b=Math.floor(amt/ids.length),r=amt-b*ids.length;return ids.map((id,i)=>[id,b+(i<r?1:0)])}
function gNet(g){const n={};g.mem.forEach(m=>n[m]=0);for(const e of g.exp){n[e.by]=(n[e.by]||0)+e.amt;shares(e.amt,e.split).forEach(([id,v])=>n[id]=(n[id]||0)-v)}for(const p of g.pay){n[p.from]=(n[p.from]||0)+p.amt;n[p.to]=(n[p.to]||0)-p.amt}return n}
function gDebts(g){const n=gNet(g),cr=[],db=[];for(const[id,v]of Object.entries(n)){if(v>0)cr.push([id,v]);else if(v<0)db.push([id,-v])}cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
 while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);out.push({from:db[i][0],to:cr[j][0],amt:x});db[i][1]-=x;cr[j][1]-=x;if(!db[i][1])i++;if(!cr[j][1])j++}return out}

function savAt(end){let c=0;for(const a of S.accounts.filter(a=>a.active&&a.type==='savings')){c+=a.init;for(const x of S.txns)if(x.acc===a.id&&x.date<=end)c+=x.type==='income'?x.amt:-x.amt;for(const x of S.trs){if(x.date>end)continue;if(x.to===a.id)c+=x.amt;if(x.from===a.id)c-=x.amt}}return c}

function lineChart(P){const w=320,h=110,n=P.length,vs=P.map(p=>p.v),mn=Math.min(0,...vs),mx=Math.max(1,...vs),rg=mx-mn||1,x=i=>(n===1?w/2:10+i*(w-20)/(n-1)).toFixed(1),y=v=>(h-4-(v-mn)/rg*(h-14)).toFixed(1),pts=P.map((p,i)=>x(i)+','+y(p.v));

const KL={inc:'inc',exp:'exp',tr:'tr',pay:'pays',rinc:'rinc',owed:'owed',note:'nts'};
function calEvents(a,b){const m={},add=(d,e)=>{if(d>=a&&d<=b)(m[d]=m[d]||[]).push(e)};
 for(const x of S.txns)add(x.date,{k:x.type==='income'?'inc':'exp',txt:title({k:'t',x}),amt:x.amt,a:'edit:t:'+x.id});
 for(const x of S.trs)add(x.date,{k:'tr',txt:accName(x.from)+' → '+accName(x.to),amt:x.amt,a:'edit:r:'+x.id});
 for(const p of S.pays){if(!p.active)continue;let d=p.next,n=0;while(d<=b&&n++<80){add(d,{k:'pay',txt:p.name,amt:p.amt,a:'go:pays'});d=nxt(d,p.freq,p.day)}}
 for(const r of S.rinc){if(!r.active)continue;let d=r.next,n=0;while(d<=b&&n++<80){add(d,{k:'rinc',txt:r.name,amt:r.amt,a:'go:rinc'});if(r.freq==='once')break;d=nxt(d,r.freq,r.day)}}
 for(const o of S.owed){const st=oStat(o);if(st.rem>0&&o.exp)add(o.exp,{k:'owed',txt:o.who,amt:st.rem,a:'go:owed'})}
 for(const n of S.notes)if(n.on)add(n.on,{k:'note',txt:n.title,a:'go:nts'});
 return m}

 <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0"><button class="pill" data-a="cn:-1">‹</button><b class="serif" style="font-size:20px;text-align:center">${label}</b><button class="pill" data-a="cn:1">›</button></div>
 ${v==='month'?`<div class="calg">${wd}${days.map(cell).join('')}</div>`:days.map(x=>`<div class="card" style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b class="${x===today()?'t':''}">${new Date(x+'T00:00').toLocaleDateString(loc(),{weekday:'long'})}</b><span class="lbl">${fd(x)}</span></div>${list(x)}</div>`).join('')}

 else if(a==='nm')UI.modal={k:p,type:q};
 else if(a==='settle')UI.modal={k:'s',type:p,id:q};
 else if(a==='gcon')UI.modal={k:'gc',id:p};
 else if(a==='rm')UI.rm=sh(UI.rm||today().slice(0,7),+p);
 else if(a==='print'){try{window.print()}catch(_){}}
 else if(a==='ndone'){S.notes.find(x=>x.id===p).done=true}
 else if(a==='rp'){UI.rp=p;UI.toast=''}
 else if(a==='rn'){UI.rd=shiftP(UI.rp||'month',UI.rd||today(),+p)}
 else if(a==='csel'){UI.csel=p}
 else if(a==='bk'){exportBackup();return}
 else if(a==='tf0'){UI.tfs=b32enc(crypto.getRandomValues(new Uint8Array(20)));UI.modal={k:'tf'}}
 else if(a==='aforgot'){UI.au={pick:UI.au.pick,forgot:true}}
 else if(a==='lock'){S.lock.on=p==='on'}
 else if(a==='lockm'){S.lock.mins=+p}
 else if(a==='lockn'){UI.locked=true;UI.pin='';UI.perr=''}
 else if(a==='key'){lockKey(p)}
 else if(a==='cv'){UI.cv=p}
 else if(a==='cn'){const d=UI.cd||today();UI.cd=(UI.cv||'month')==='month'?sh(d.slice(0,7),+p)+'-01':addD(d,7*+p);UI.csel=UI.cd}
 else if(a==='ctoday'){UI.cd=today();UI.csel=today()}
 else if(a==='exp'){exportRep(p);return}
 else if(a==='menu'){UI.menu=!UI.menu}
 else if(a==='go'){UI.toast='';UI.menu=false;UI.modal=null;UI.gid=null;UI.pend=null;if(['home','moves','accounts','settings'].includes(p)){UI.tab=p;UI.sec=null}else{UI.tab='more';UI.sec=p}}
 else if(a==='apick'){UI.au={pick:p}}
 else if(a==='aback'){UI.au=null}
 else if(a==='llang'){S.lang=S.lang==='en'?'es':'en';ST.lang=S.lang}
 else if(a==='logout'){save();ST.cur=null;S=load();UI={tab:'home',q:'',f:'all',acc:'',modal:null,pend:null}}
 else if(a==='gopen'){UI.gid=p}
 else if(a==='gback'){UI.gid=null}
 else if(a==='gedit'){UI.modal={k:p==='e'?'ge':'gs',id:q}}
 else if(a==='gsettle'){const w=el.dataset.a.split(':');UI.modal={k:'gs',f:w[1],to:w[2],amt:+w[3]}}
 else if(a==='gsettle0'){UI.modal={k:'gs'}}
 else if(a==='filt'){UI.f=p}
 else if(a==='accTx'){UI.acc=p;UI.tab='moves'}
 else if(a==='clearAcc')UI.acc='';
 else if(a==='toggleAcc'){const x=accOf(p);x.active=!x.active;UI.modal=null}
 else if(a==='del'){const key=p+':'+q;if(UI.pend!==key){UI.pend=key;return render()}
   if(p==='gr'){ST.groups=ST.groups.filter(x=>x.id!==q);UI.gid=null}else if(p==='ge'||p==='gs'){const g=curG();if(p==='ge')g.exp=g.exp.filter(x=>x.id!==q);else g.pay=g.pay.filter(x=>x.id!==q)}else if(p==='c'){const[ty,i]=q.split('.');S.cats[ty].splice(+i,1)}else{const Ln={t:'txns',r:'trs',o:'owed',ri:'rinc',py:'pays',g:'goals',n:'notes'}[p];S[Ln]=S[Ln].filter(x=>x.id!==q)}UI.modal=null;UI.pend=null}
 else if(a==='reset'){UI.modal={k:'rs'}}
 save();render()});

document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;document.getElementById('list').innerHTML=listHtml()}});
document.addEventListener('change',e=>{if(e.target.id==='rbf'){readBackup(e.target);return}if(e.target.id==='fund')document.getElementById('ft').classList.toggle('hide',e.target.value!=='other');if(e.target.id==='cat'){document.getElementById('ct').classList.toggle('hide',!['other','others'].includes(e.target.value))}});
document.addEventListener('submit',e=>{e.preventDefault();if(authSubmit(e.target))return;const f=e.target,d=Object.fromEntries(new FormData(f)),k=f.dataset.kind,id=UI.modal.id,err=m=>{document.getElementById('err').textContent=m};
 if(k==='tf'){enable2fa(d);return}
 if(['o','ri','py','g','gc','s','n','c','b','gr','ge','gs','rs','rb','pc','sr','tfoff'].includes(k)){const r=submit2(k,d,id,UI.modal);if(r)return err(r);UI.modal=null;UI.pend=null;save();render();return}
 if(k==='a'){const name=(d.name||'').trim();if(!name)return err(t('errName'));const init=parseAmt(d.init,true);if(init===null)return err(t('errAmt'));
  if(id){Object.assign(accOf(id),{name,type:d.type,init})}else S.accounts.push({id:uid(),name,type:d.type,init,active:true})}
 else{const amt=parseAmt(d.amt);if(amt===null)return err(t('errAmt'));
  if(k==='t'){if(!d.acc)return err(t('errAcc'));const rec={type:f.dataset.type,acc:d.acc,cat:d.cat,ctext:['other','others'].includes(d.cat)?(d.ctext||'').trim():'',amt,date:d.date||today(),notes:(d.notes||'').trim()};
   if(id)Object.assign(S.txns.find(x=>x.id===id),rec);else S.txns.push({id:uid(),ts:Date.now(),...rec})}
  else{if(!d.from||!d.to)return err(t('errAcc'));if(d.from===d.to)return err(t('errSame'));const rec={from:d.from,to:d.to,amt,date:d.date||today(),notes:(d.notes||'').trim()};
   if(id)Object.assign(S.trs.find(x=>x.id===id),rec);else S.trs.push({id:uid(),ts:Date.now(),...rec})}}
 UI.modal=null;UI.pend=null;save();render()});
if(ST.cur&&S.lock&&S.lock.on)UI.locked=true;
render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
